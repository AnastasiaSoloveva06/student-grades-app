services:
  db:
    image: postgres:16
    container_name: students_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./db/data:/var/lib/postgresql/data          # файлы БД сохраняются между запусками
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    # порт 5432 наружу не открыт: к БД обращается только приложение

  app:
    build: .
    container_name: students_app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "5000:5000"
    volumes:
      - ./logs:/app/logs                              # логи приложения
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
